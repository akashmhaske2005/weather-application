<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

    <div class="app">

        <!-- Hero Section -->
        <section class="hero" id="hero">

            <!-- Navigation -->
            <nav class="navbar">

                <!-- Logo -->
                <div class="logo">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <h2>Weather App</h2>
                </div>
                <!-- Search Box -->
                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search-input" placeholder="Search for a city..." autocomplete="off">

                    <button id="search-btn">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div id="suggestions" class="suggestions">
                    </div>

                </div>
                <!-- Current Location Button -->
                <button class="location-btn">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    Current Location
                </button>
            </nav>

            <!-- Weather Content -->

            <div class="weather-content">

                <!-- Left Side -->
                <div class="weather-info">
                    <div class="city-section">
                        <h1 id="city-name">Delhi, India</h1>
                        <p id="current-date">
                            Saturday, 25 May 2024 • 10:30 AM
                        </p>

                    </div>

                    <!-- Temperature -->
                    <div class="temperature-section">
                        <div class="temperature">
                            <h2 id="temperature">
                                28<span>°C</span>
                            </h2>

                        </div>

                        <div class="weather-icon">
                            <img src="/assets/icons/cloud-sun.png" alt="Weather Icon" id="weather-icon">
                        </div>

                    </div>
                    <!-- Weather Description -->
                    <div class="weather-description">
                        <h3 id="weather-condition">
                            Partly Cloudy
                        </h3>
                        <!-- Feels Like -->
                        <p>
                            Feels like
                            <span id="feels-like">30°C</span>
                        </p>

                    </div>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">
                <!-- Humidity -->
                <div class="detail-card">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">64%</h3>

                    </div>

                </div>

                <!-- Wind -->
                <div class="detail-card">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p>Wind Speed</p>
                        <h3 id="wind-speed">12 km/h</h3>

                    </div>

                </div>

                <!-- Pressure -->
                <div class="detail-card">
                    <i class="fa-solid fa-gauge-high"></i>
                    <div>
                        <p>Pressure</p>
                        <h3 id="pressure">1012 hPa</h3>

                    </div>

                </div>

                <!-- Visibility -->
                <div class="detail-card">
                    <i class="fa-solid fa-eye"></i>
                    <div>
                        <p>Visibility</p>
                        <h3 id="visibility">8 km</h3>

                    </div>

                </div>

                <!-- Sunrise -->
                <div class="detail-card">
                    <i class="fa-solid fa-sun"></i>
                    <div>
                        <p>Sunrise</p>
                        <h3 id="sunrise">5:28 AM</h3>

                    </div>

                </div>

                <!-- Sunset -->
                <div class="detail-card">
                    <i class="fa-solid fa-moon"></i>
                    <div>
                        <p>Sunset</p>
                        <h3 id="sunset">7:12 PM</h3>

                    </div>

                </div>

            </div>

        </section>

        <!-- Forecast -->

        <section class="forecast">
            <h2>5 Day Forecast</h2>

            <div class="forecast-container" id="forecast-container">

            </div>

        </section>

        <!-- Footer -->

        <footer class="footer">

            <!-- Recent Searches -->
            <div class="recent-searches">
                <h3>Recent Searches</h3>

                <div class="search-history" id="search-history">
                    <span class="history-item">Pune</span>
                    <span class="history-item">Delhi</span>
                    <span class="history-item">Mumbai</span>

                </div>

            </div>
            <!-- Credits -->
            <div class="footer-bottom">
                <p>
                    Made with
                    <i class="fa-solid fa-heart"></i>
                    by <strong>Akash</strong>
                </p>

            </div>
        </footer>

    </div>


    <script type="module" src="/js/app.js"></script>
</body>

</html>
